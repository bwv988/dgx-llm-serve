x-common: &common
  image: nvcr.io/nvidia/vllm:26.02-py3
  restart: unless-stopped
  ipc: host
  ports:
    - "127.0.0.1:8000:8000"
  volumes:
    - ${HOME}/models:/app/model:ro
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
  ulimits:
    memlock:
      soft: -1
      hard: -1
    stack:
      soft: 67108864
      hard: 67108864
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 300s

services:
  vllm-qwen:
    <<: *common
    profiles: ["qwen"]
    command:
      - vllm
      - serve
      - /app/model/Qwen/Qwen3-Coder-30B-A3B-Instruct
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - Qwen/Qwen3-Coder-30B-A3B-Instruct
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - "0.9"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "4"
      - --max-num-batched-tokens
      - "2048"
      - --dtype
      - auto
      - --kv-cache-dtype
      - auto
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder

  vllm-qwen35:
    <<: *common
    # FIXME: Check if Qwen3.5 works with 26.02.
    image: vllm/vllm-openai:v0.17.1-cu130
    profiles: ["qwen35"]
    # vllm/vllm-openai has ENTRYPOINT ["vllm", "serve"] preset, so only specify model path and beyond for command
    command:
      - /app/model/Qwen/Qwen3.5-35B-A3B-FP8
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - Qwen/Qwen3.5-35B-A3B-FP8
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - "0.9"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "4"
      - --max-num-batched-tokens
      - "2048"
      - --dtype
      - auto
      - --kv-cache-dtype
      - auto
      - --enforce-eager
      - --language-model-only
      - --reasoning-parser
      - qwen3

  vllm-nemotron:
    <<: *common
    profiles: ["nemotron"]
    command:
      - vllm
      - serve
      - /app/model/hf/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - nemotron-3-super
#- --async-scheduling
      - --dtype
      - auto
      - --kv-cache-dtype
      - fp8
      - --tensor-parallel-size
      - "1"
      - --max-model-len
      - "262144"
      - --enable-expert-parallel
      - --swap-space
      - "0"
      - --trust-remote-code
      - --gpu-memory-utilization
      - "0.9"
      - --max-cudagraph-capture-size
      - "128"
      - --enable-chunked-prefill
      - --mamba-ssm-cache-dtype
      - float16
      - --reasoning-parser
      - nemotron_v3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder

  vllm-qwen2.5-math:
    <<: *common
    profiles: ["qwen2.5-math"]
    command:
      - vllm
      - serve
      - /app/model/hf/Qwen2.5-Math-1.5B-Instruct
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - hf/Qwen2.5-Math-1.5B-Instruct

  # --- multi profile: Qwen3-Coder + Nemotron simultaneous startup ---

  vllm-multi-proxy:
    image: openresty/openresty:alpine
    profiles: ["multi"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    depends_on:
      vllm-multi-qwen:
        condition: service_healthy
      vllm-multi-nemotron:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  vllm-multi-qwen:
    <<: *common
    # Qwen3MoE requires vLLM 0.8.4+. CUDA 13.0.2 native, no Forward Compat needed
    image: nvcr.io/nvidia/vllm:25.11-py3
    profiles: ["multi"]
    ports: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    command:
      - vllm
      - serve
      - /app/model/Qwen/Qwen3-Coder-30B-A3B-Instruct
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - Qwen/Qwen3-Coder-30B-A3B-Instruct
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      # bf16 (56.93 GiB) + 0.50 (64 GiB) is boundary where KV cache is ~70 MiB insufficient
      - "0.52"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "4"
      - --max-num-batched-tokens
      - "2048"
      - --dtype
      - auto
      - --kv-cache-dtype
      - auto
      - --enforce-eager

  vllm-multi-nemotron:
    <<: *common
    # NemotronH + NVFP4 requires 26.02. Driver 580 uses Forward Compat exclusively
    profiles: ["multi"]
    ports: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    depends_on:
      vllm-multi-qwen:
        condition: service_healthy
    command:
      - vllm
      - serve
      - /app/model/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - "0.25"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "4"
      - --max-num-batched-tokens
      - "2048"
      - --dtype
      - auto
      - --kv-cache-dtype
      - auto
      - --trust-remote-code
      - --enforce-eager

  vllm-nemotron-vl:
    <<: *common
    profiles: ["nemotron-vl"]
    command:
      - vllm
      - serve
      - /app/model/nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-NVFP4-QAD
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-NVFP4-QAD
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - "0.9"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "4"
      - --max-num-batched-tokens
      - "2048"
      - --dtype
      - auto
      - --kv-cache-dtype
      - auto
      - --limit-mm-per-prompt
      - image=1
      - --trust-remote-code
      - --enforce-eager
